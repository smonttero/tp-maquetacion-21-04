<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SM Store</title>
    <link rel="icon" href="../../Images/SM STORE.jpeg">
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="reclamos.css">
    <link href="https://fonts.googleapis.com/css2?family=Work+Sans:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">
</head>
<body class="work-sans">
        <nav>
            <div class="container-nav">
                <div class="sm-nav">
                    <h2>S<span class="letters-color">M</span> STORE</h2>
                </div>
                <div class="nav-group">
                    <div>
                        <a href="principal.html"><h2>Menú</h2></a>
                    </div>
                    <div>
                        <a href="principal.html#contact-container"><h2>Contactos</h2></a>
                    </div>
                    <div>
                        <a href="#"><h2>Reclamos</h2></a>
                    </div>
                </div>
            </div>
        </nav>
    
    <!-- inicio form -->
    <form>
        <h2>Envíanos un mensaje</h2>
        
        <div>
            <label for="nombre">Nombre Completo</label>
            <input type="text" id="nombre" name="nombre" placeholder="Tu nombre..." required>
        </div>

        <div class="input-group">
            <label for="email">Correo Electrónico</label>
            <input type="email" id="email" name="email" placeholder="ejemplo@correo.com" required>
        </div>

        <div class="input-group">
            <label for="tel">Teléfono</label>
            <input type="tel" id="tel" name="tel" placeholder="Tu número de teléfono">
        </div>

        <div class="input-group">
            <label for="servicio">Servicio afectado</label>
            <select id="servicio" name="servicio">
                <option selected disabled value="plataforma afectada">Plataforma afectada</option>
                <option value="netflix">Netflix</option>
                <option value="disney">Disney</option>
                <option value="hbo">HBO Max</option>
                <option value="prime">Prime Video</option>
                <option value="paramount">Paramount</option>
            </select>
        </div>
        <div class="input-group">
            <label>Tipo de problema</label>
            <div class="radio-group">
                <label><input type="radio"  value="redes">Problemas con contraseña.</label>
                <label><input type="radio"  value="amigo">Caducó el inicio de sesión.</label>
                <label><input type="radio"  value="otro">Otro (Explicar)</label>
            </div>
        </div>

        <div class="input-group">
            <label for="mensaje">Datos de lo sucedido...</label>
            <textarea id="mensaje" name="mensaje"   placeholder="Escribe aquí tus dudas..."></textarea>
        </div>

        <div class="button-group">
            <button type="submit" class="btn-send">Enviar Mensaje</button>
            <button type="reset" class="btn-reset">Limpiar</button>
        </div>
    </form>
    <!-- fin form -->
    <div class="bg-container">
        <canvas id="particleCanvas"></canvas>
        <div class="grid-overlay"></div>
    </div>
    <script src="./scripts.js"></script>
</body>
</html>
